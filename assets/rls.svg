<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><defs><pattern id="d" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2a44"/></pattern></defs><rect width="1200" height="460" rx="20" fill="#0a0f1e"/><rect width="1200" height="460" rx="20" fill="url(#d)"/><text x="40" y="50" fill="#e5e9f2" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="start" >Row-level security with user attributes</text><text x="40" y="76" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" font-weight="400" text-anchor="start" >Admin → User Attributes → assign per user/team → filter in the data model → every workbook inherits it</text><rect x="470" y="105" width="300" height="330" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="1.6" /><rect x="470" y="105" width="300" height="330" rx="14" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-dasharray="70 1260"><animate attributeName="stroke-dashoffset" from="0" to="-1330" dur="6s" repeatCount="indefinite"/></rect><text x="620" y="135" fill="#3b82f6" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="3">DATA MODEL</text><rect x="488" y="155" width="264" height="90" rx="10" fill="#0d1528" stroke="#1f2a44" stroke-width="1" /><text x="500" y="178" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" >RLS column (formula):</text><text x="500" y="200" fill="#e5e9f2" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" text-anchor="start" >CurrentUserAttributeText(</text><text x="500" y="218" fill="#e5e9f2" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" text-anchor="start" >  &quot;restaurant&quot;) = [Restaurant]</text><text x="500" y="238" fill="#34d399" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="600" text-anchor="start" >filter → True · column hidden</text><rect x="488" y="260" width="264" height="90" rx="10" fill="#0d1528" stroke="#1f2a44" stroke-width="1" /><text x="500" y="283" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" >Custom SQL:</text><text x="500" y="305" fill="#e5e9f2" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" text-anchor="start" >WHERE restaurant_name =</text><text x="500" y="323" fill="#e5e9f2" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" text-anchor="start" >{{#formula CurrentUser</text><text x="500" y="341" fill="#e5e9f2" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" text-anchor="start" >AttributeText(&#x27;restaurant&#x27;)}}</text><text x="620" y="400" fill="#94a3b8" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" >applied before any workbook sees data</text><rect x="40" y="120" width="330" height="80" rx="14" fill="#111a2e" stroke="#22d3ee" stroke-width="1.6" /><text x="60" y="152" fill="#e5e9f2" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" >Owner · Brand A</text><text x="60" y="176" fill="#22d3ee" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" text-anchor="start" >attribute: restaurant = A</text><path d="M370,160 C420,160 420,270 470,270" stroke="#334155" stroke-dasharray="4 5" fill="none"/><circle r="4.5" fill="#22d3ee"><animateMotion path="M370,160 C420,160 420,270 470,270" dur="1.8s" begin="0.0s" repeatCount="